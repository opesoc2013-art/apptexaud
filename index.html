<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voz a Texto | App de Práctica</title>
    <meta name="description" content="Convierte texto a voz directamente en tu navegador.">

    <!-- VISTA PREVIA PARA WHATSAPP -->
    <!-- IMPORTANTE: Cambia "TU-USUARIO" y "TU-REPO" por tu link real de GitHub Pages -->
    <meta property="og:title" content="Voz a Texto">
    <meta property="og:description" content="Escucha tus textos con voces naturales.">
    <meta property="og:image" content="https://TU-USUARIO.github.io/TU-REPO/preview.png">
    <meta property="og:url" content="https://TU-USUARIO.github.io/TU-REPO/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#349e53">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root {
            --bg: #2b8544;
            --card: #ffffff;
            --accent: #349e53;
            --text: #333333;
            --text-dim: #666666;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; color: var(--accent); text-align: center; }
        p.sub { color: var(--text-dim); font-size: 0.9rem; margin-bottom: 20px; text-align: center; }
        textarea {
            width: 100%; height: 150px; padding: 16px; border-radius: 16px;
            border: 2px solid #e2e8f0; background: #f8fafc; color: var(--text);
            font-size: 1rem; resize: none; outline: none; font-family: inherit; transition: border 0.2s;
        }
        textarea:focus { border-color: var(--accent); }
        .controls { display: flex; gap: 12px; margin-top: 16px; }
        button {
            flex: 1; padding: 14px; border-radius: 14px; border: none;
            font-weight: 700; font-size: 1rem; cursor: pointer; transition: transform 0.1s;
        }
        button:active { transform: scale(0.97); }
        #speakBtn { background: var(--accent); color: white; }
        #speakBtn:disabled { opacity: 0.5; cursor: not-allowed; }
        #stopBtn { background: #e2e8f0; color: var(--text); }
        .status { margin-top: 16px; font-size: 0.8rem; color: var(--text-dim); text-align: center; min-height: 1.2em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Voz a Texto</h1>
        <p class="sub">Escribe y escucha con voces naturales</p>

        <textarea id="textInput" placeholder="Escribe aquí el texto que quieres escuchar..."></textarea>

        <div class="controls">
            <button id="speakBtn">🔊 Escuchar</button>
            <button id="stopBtn">⏹️ Detener</button>
        </div>

        <div id="status" class="status">Cargando voces del sistema...</div>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const speakBtn = document.getElementById('speakBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');
        
        let voices = [];

        function loadVoices() {
            voices = speechSynthesis.getVoices();
            // Intentar buscar una voz en español de buena calidad
            const bestVoice = voices.find(v => v.lang.startsWith('es') && v.name.includes('Google')) || 
                              voices.find(v => v.lang.startsWith('es'));
            
            if (bestVoice) {
                statusDiv.textContent = `Voz lista: ${bestVoice.name}`;
            } else {
                statusDiv.textContent = 'Usando voz por defecto.';
            }
        }

        // Cargar voces (algunos navegadores tardan un segundo)
        speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        speakBtn.addEventListener('click', () => {
            const text = textInput.value.trim();
            if (!text) {
                statusDiv.textContent = 'Por favor, escribe algo primero.';
                return;
            }

            speechSynthesis.cancel(); // Detener si había algo reproduciéndose

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;

            const esVoice = voices.find(v => v.lang.startsWith('es'));
            if (esVoice) utterance.voice = esVoice;

            utterance.onstart = () => { statusDiv.textContent = 'Hablando...'; speakBtn.disabled = true; };
            utterance.onend = () => { statusDiv.textContent = 'Listo.'; speakBtn.disabled = false; };
            utterance.onerror = () => { statusDiv.textContent = 'Error al reproducir.'; speakBtn.disabled = false; };

            speechSynthesis.speak(utterance);
        });

        stopBtn.addEventListener('click', () => {
            speechSynthesis.cancel();
            statusDiv.textContent = 'Detenido.';
            speakBtn.disabled = false;
        });

        // Registrar Service Worker para que sea instalable
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('Error SW:', err));
            });
        }
    </script>
</body>
</html>
